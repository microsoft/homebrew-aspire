name: Validate Homebrew tap

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate cask (${{ matrix.runner }}, Homebrew 7.0.9)
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test consistency comparison
        run: ruby scripts/test-cask-consistency.rb
      - name: Set up .NET SDK for installed CLI smoke test
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Set up tools for tap-wide style
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install shellcheck actionlint
      - name: Validate checked-out cask
        env:
          HOMEBREW_VALIDATION_REF: 7.0.9
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: bash scripts/validate-cask.sh
